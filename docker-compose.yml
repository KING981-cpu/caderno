
services:

  app:
    build: .
    container_name: app_caderno
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
      - APP_ENV=development
      - APP_DEBUG=true
      - LOG_PATH=/var/log/caderno/app.log
    depends_on:
      - db
    networks:
      - rede_sistema
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  db:
    image: mariadb:10.4
    container_name: db_caderno
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - rede_sistema
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  rede_sistema:
    driver: bridge
